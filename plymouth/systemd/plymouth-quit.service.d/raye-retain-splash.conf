# Keep the eye on screen until the sign-in screen paints, instead of a
# black screen in between. Only when a display manager is about to start
# or running: on a text-only boot the console has to come back. The ring
# goes first, so the picture left behind is not a ring stopped mid-turn.
# sddm starts after this unit, so here it only has a waiting job, which
# list-jobs does not show under the display-manager alias; show does.
[Service]
ExecStart=
ExecStart=-/bin/sh -c 'if systemctl -q is-active display-manager.service || [ -n "$$(systemctl show -P Job display-manager.service 2>/dev/null)" ]; then /usr/bin/plymouth display-message --text=raye:handoff; exec /usr/bin/plymouth quit --retain-splash; fi; exec /usr/bin/plymouth quit'
