# The Raye lock screen on Hyprland (hyprlock): the wallpaper softened, the
# time and the date in the middle of the upper half, the account picture
# and the password field below, in Raye's colours and Inter.

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = rayeIn, 0, 0, 0, 1
    animation = fadeIn, 1, 2.5, rayeIn
    animation = fadeOut, 1, 1.67, rayeIn
    animation = inputFieldDots, 1, 1.67, rayeIn
}

background {
    monitor =
    path = /usr/share/wallpapers/Raye/contents/images/3840x2160.png
    color = rgb(0e0a17)
    blur_passes = 3
    blur_size = 8
    brightness = 0.72
    vibrancy = 0.17
}

label {
    monitor =
    text = $TIME
    color = rgb(f3eaff)
    font_size = 112
    font_family = Inter SemiBold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgb(f3eaff)
    font_size = 22
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face.icon
    size = 112
    rounding = -1
    border_size = 0
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(f3eaff)
    font_size = 18
    font_family = Inter SemiBold
    position = 0, -122
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 296, 40
    outline_thickness = 1
    rounding = 6
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(ffffff33)
    inner_color = rgba(1a1028e6)
    font_color = rgb(f3eaff)
    font_family = Inter
    check_color = rgb(7b3cff)
    fail_color = rgb(ff6b8a)
    capslock_color = rgb(c040ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##b9a8d6">PIN or password</span>
    fail_text = <span foreground="##ffb3c4">That password is not right</span>
    position = 0, -180
    halign = center
    valign = center
}
