# Raye on Hyprland: the defaults of every account (installed to
# /usr/share/raye/hyprland/hyprland.conf). The session starts Hyprland with
# ~/.config/raye-hyprland/hyprland.conf, which sources this file first and
# the user's own file last, so a user's line always wins.
#
# It follows Raye's KWin set-up: windows float and open centred at their
# own size, the Windows keys do what they do on Windows, and motion uses
# the same timings (250 ms in from 94 %, 167 ms out).

monitor = , preferred, auto, auto

env = XCURSOR_THEME, Raye
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Raye
env = HYPRCURSOR_SIZE, 24
# the Raye style, colours and icons in Qt and KDE apps
env = QT_QPA_PLATFORMTHEME, kde
env = QT_QPA_PLATFORM, wayland;xcb
env = GDK_BACKEND, wayland,x11
env = MOZ_ENABLE_WAYLAND, 1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE QT_QPA_PLATFORMTHEME
exec-once = /usr/libexec/raye-hyprland-start

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(7b3cffcc)
    col.inactive_border = rgba(ffffff1f)
    resize_on_border = true
    extend_border_grab_area = 8
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false

    shadow {
        enabled = true
        range = 24
        render_power = 3
        offset = 0 6
        color = rgba(0000005c)
        color_inactive = rgba(00000033)
    }

    # the acrylic of the taskbar, Start and the flyouts (KWin: strength 11,
    # a little grain)
    blur {
        enabled = true
        size = 11
        passes = 3
        noise = 0.04
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.17
        new_optimizations = true
    }
}

animations {
    enabled = true
    # Raye's curves (shell Motion): entrance 0,0,0,1, exit 1,0,1,1, point
    # to point 0.55,0.55,0,1. Durations are in tenths of a second.
    bezier = rayeIn, 0, 0, 0, 1
    bezier = rayeOut, 1, 0, 1, 1
    bezier = rayeMove, 0.55, 0.55, 0, 1

    animation = windowsIn, 1, 2.5, rayeIn, popin 94%
    animation = windowsOut, 1, 1.67, rayeOut, popin 96%
    animation = windowsMove, 1, 2.5, rayeMove
    animation = fadeIn, 1, 0.83, rayeIn
    animation = fadeOut, 1, 1.67, rayeOut
    animation = fadeSwitch, 1, 1.67, rayeMove
    animation = fadeShadow, 1, 1.67, rayeMove
    animation = border, 1, 1.67, rayeMove
    # flyouts rise from the taskbar in 250 ms and leave in 167 ms
    animation = layersIn, 1, 2.5, rayeIn, slide bottom
    animation = layersOut, 1, 1.67, rayeOut, slide bottom
    animation = fadeLayersIn, 1, 0.83, rayeIn
    animation = fadeLayersOut, 1, 1.67, rayeOut
    animation = workspaces, 1, 2.5, rayeMove, slide
    animation = specialWorkspace, 1, 2.5, rayeMove, slidevert
}

input {
    # the layout of the machine: written by the session from the system's
    # keyboard settings, see raye-hyprland-session
    kb_layout = us
    # focus follows clicks, the way it does on Windows
    follow_mouse = 2
    float_switch_override_focus = 0
    sensitivity = 0
    accel_profile = adaptive

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3
}
gesture = 4, horizontal, workspace

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(0e0a17)
    focus_on_activate = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    middle_click_paste = false
}

xwayland {
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

dwindle {
    preserve_split = true
}

# --- windows -------------------------------------------------------------

# Windows float, at their own size, centred on the screen in use: tiling
# is there for whoever wants it (Win+Shift+F), it is not the default.
windowrule {
    name = raye-float
    match:class = .*

    float = yes
    center = yes
}

# apps do not get to maximize themselves at start (Raye's KWin rule)
windowrule {
    name = raye-no-maximize-on-open
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = raye-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# the screenshot overlay and the root prompt stay above the rest
windowrule {
    name = raye-polkit
    match:class = ^(org\.raye\.polkit.*)$

    pin = yes
    stay_focused = yes
}

# the shell's surfaces: blurred behind, and the acrylic's own alpha decides
# where the blur shows
layerrule {
    name = raye-acrylic
    match:namespace = ^raye-(panel|start|quick|centre|toast)$

    blur = on
    ignore_alpha = 0.05
}

layerrule {
    name = raye-wallpaper
    match:namespace = ^raye-wallpaper$

    no_anim = on
}

# --- keys ----------------------------------------------------------------

$shell = raye-hypr-shell

# Start opens on the Win key alone: a release bind, and any other key
# pressed with Win cancels it
bindr = SUPER, SUPER_L, exec, $shell --toggle start
bind = CTRL, Escape, exec, $shell --toggle start
bind = SUPER, S, exec, $shell --toggle search
bind = SUPER, Q, exec, $shell --toggle search
bind = SUPER, A, exec, $shell --toggle quick
bind = SUPER, N, exec, $shell --toggle centre
bind = SUPER, X, exec, $shell --toggle quicklinks

bind = SUPER, E, exec, $shell --launch org.kde.dolphin.desktop
bind = SUPER, I, exec, $shell --launch org.raye.settings.desktop
bind = CTRL SHIFT, Escape, exec, $shell --launch org.raye.taskmanager.desktop
bind = SUPER, R, exec, raye-run

bind = SUPER, D, exec, $shell --desktop
bind = SUPER, M, exec, $shell --desktop
bind = SUPER, L, exec, loginctl lock-session

bind = ALT, F4, killactive,
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, alterzorder, top
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, alterzorder, top

bind = SUPER, left, exec, $shell --snap left
bind = SUPER, right, exec, $shell --snap right
bind = SUPER, up, exec, $shell --snap up
bind = SUPER, down, exec, $shell --snap down
bind = SUPER SHIFT, F, togglefloating,
bind = SUPER SHIFT, left, movewindow, mon:l
bind = SUPER SHIFT, right, movewindow, mon:r

bind = SUPER SHIFT, S, exec, raye-hypr-screenshot region
bind = , Print, exec, raye-hypr-screenshot region
bind = SUPER, Print, exec, raye-hypr-screenshot screen

# desktops: Win+Ctrl+arrows, Win+Ctrl+D a new one
bind = SUPER CTRL, left, workspace, r-1
bind = SUPER CTRL, right, workspace, r+1
bind = SUPER CTRL, D, workspace, emptynm
bind = SUPER CTRL, F4, exec, $shell --close-desktop

# Win+1...9: the apps of the taskbar
bind = SUPER, 1, exec, $shell --task 1
bind = SUPER, 2, exec, $shell --task 2
bind = SUPER, 3, exec, $shell --task 3
bind = SUPER, 4, exec, $shell --task 4
bind = SUPER, 5, exec, $shell --task 5
bind = SUPER, 6, exec, $shell --task 6
bind = SUPER, 7, exec, $shell --task 7
bind = SUPER, 8, exec, $shell --task 8
bind = SUPER, 9, exec, $shell --task 9

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
