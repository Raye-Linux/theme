# Locking and screen sleep on Hyprland: Win+L and closing the lid lock at
# once, the screen turns off after 10 minutes and locks a little later.

general {
    lock_cmd = pidof hyprlock || hyprlock -c "${XDG_CONFIG_HOME:-$HOME/.config}/raye-hyprland/hyprlock.conf"
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 660
    on-timeout = loginctl lock-session
}
