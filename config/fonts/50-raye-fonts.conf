<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Raye's fonts (installed to /etc/fonts/conf.d/50-raye-fonts.conf).

  Inter is the interface and reading font, Cascadia Mono the fixed one.
  Programs and web pages that ask for a Windows font name get Inter or
  Cascadia Mono: no Microsoft font is ever installed or needed. Arial,
  Times New Roman and Courier New keep their metric-compatible
  Liberation faces (30-metric-aliases.conf), so documents keep their
  line breaks.

  Rendering stays the system's: slight hinting, RGB sub-pixel order and
  the default LCD filter (10-hinting-slight, 10-sub-pixel-rgb,
  11-lcdfilter-default). No DPI is forced here.

  This file is read before 60-latin.conf, so the families preferred
  here come first.
-->
<fontconfig>

  <!-- Generic families -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
    </prefer>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Cascadia Mono</family>
    </prefer>
  </alias>

  <!-- Windows interface fonts: Inter -->
  <alias binding="strong">
    <family>Segoe UI</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Variable</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Variable Text</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Variable Small</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Historic</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Tahoma</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>MS Shell Dlg</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>MS Shell Dlg 2</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Microsoft Sans Serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>

  <!-- The weights Windows ships as families of their own -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Segoe UI Light</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign"><const>light</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Segoe UI Semilight</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign"><const>demilight</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Segoe UI Semibold</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign"><const>demibold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Segoe UI Black</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign"><const>black</const></edit>
  </match>

  <!-- Big titles: the display cut of Inter -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Segoe UI Variable Display</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter Display</string>
    </edit>
  </match>

  <!-- Emoji -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Segoe UI Emoji</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Windows fixed-width fonts: Cascadia Mono -->
  <alias binding="strong">
    <family>Consolas</family>
    <prefer><family>Cascadia Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Lucida Console</family>
    <prefer><family>Cascadia Mono</family></prefer>
  </alias>

  <!-- Inter Display is drawn for big sizes: no hinting from 20 px up,
       it keeps its shapes. Inter itself keeps the slight hinting. -->
  <match target="font">
    <test name="family" compare="eq">
      <string>Inter Display</string>
    </test>
    <test name="pixelsize" compare="more_eq">
      <double>20</double>
    </test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>

</fontconfig>
