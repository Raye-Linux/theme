# GTK 3 defaults for every user (installed to /etc/xdg/gtk-3.0/settings.ini).
# They cover the first session, before Plasma writes the user's own
# ~/.config/gtk-3.0/settings.ini from the colour scheme, the fonts and
# the window buttons. A user's file wins over every key here.
[Settings]
gtk-theme-name=Breeze
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Raye-Dark
gtk-cursor-theme-name=Raye
gtk-cursor-theme-size=24
gtk-font-name=Inter 10
gtk-sound-theme-name=raye
gtk-enable-event-sounds=true
gtk-enable-input-feedback-sounds=false
gtk-enable-animations=true
gtk-decoration-layout=:minimize,maximize,close
gtk-primary-button-warps-slider=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
