# Raye runs Wayland only, so the sign-in screen does too, on KWin.
# The Raye sign-in screen itself is picked by sddm-theme-raye's own file
# (sddm-theme-raye.conf, read after this one), so the stock screen stays
# in use as long as that package is not installed.
[General]
DisplayServer=wayland
# layer-shell: the greeter's surface on KWin. The on-screen keyboard is
# drawn by the sign-in screen itself, never in a window of its own.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_VIRTUALKEYBOARD_DESKTOP_DISABLE=1
# what the keys of the on-screen keyboard type into the password field
InputMethod=qtvirtualkeyboard
# leave Num Lock the way the firmware set it
Numlock=none

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=breeze
CursorTheme=Raye
CursorSize=24
EnableAvatars=true
FacesDir=/usr/share/sddm/faces
# account pictures for up to 20 accounts (SDDM's default stops at 7)
DisableAvatarsThreshold=20

[Users]
RememberLastUser=true
